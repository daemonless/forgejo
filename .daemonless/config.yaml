icon: ':simple-forgejo:'

cit:
  mode: screenshot
  port: 3000
  ssim_threshold: 0.85
  ready: "Starting new Web server"
  puid_ignore:
    - /config/ssh

build:
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: 15
      tag_desc: Built from latest upstream source release of the v15 branch.
      args:
        UPSTREAM_URL: "https://codeberg.org/api/v1/repos/forgejo/forgejo/releases"
        UPSTREAM_JQ: "map(select(.tag_name | test(\"^v15\\\\..*\"))) | sort_by(-.id) | .[0].tag_name"
        TARBALL_JQ: "map(select(.tag_name | test(\"^v15\\\\..*\"))) | sort_by(-.id) | .[0].tarball_url"
      aliases: ["lts"]
    - tag: 15-latest
      tag_desc: Built from latest upstream source release of the v15 branch with latest FreeBSD packages.
      default: true
      args:
        BASE_VERSION: "15-latest"
        UPSTREAM_URL: "https://codeberg.org/api/v1/repos/forgejo/forgejo/releases"
        UPSTREAM_JQ: "map(select(.tag_name | test(\"^v15\\\\..*\"))) | sort_by(-.id) | .[0].tag_name"
        TARBALL_JQ: "map(select(.tag_name | test(\"^v15\\\\..*\"))) | sort_by(-.id) | .[0].tarball_url"
      aliases: ["lts-latest"]
#    - tag: 15-pkg
#      pkg_name: forgejo15
#      containerfile: Containerfile.pkg
#      aliases: ["lts-pkg"]
    - tag: 15-pkg-latest
      pkg_name: forgejo15
      containerfile: Containerfile.pkg
      aliases: ["lts-pkg-latest"]
      args:
        BASE_VERSION: "15-latest"
    - tag: 16
      tag_desc: Built from latest upstream source release of the v16 branch.
      args:
        UPSTREAM_URL: "https://codeberg.org/api/v1/repos/forgejo/forgejo/releases"
        UPSTREAM_JQ: "map(select(.tag_name | test(\"^v16\\\\..*\"))) | sort_by(-.id) | .[0].tag_name"
        TARBALL_JQ: "map(select(.tag_name | test(\"^v16\\\\..*\"))) | sort_by(-.id) | .[0].tarball_url"
    - tag: 16-latest
      tag_desc: Built from latest upstream source release of the v16 branch with latest FreeBSD packages.
      args:
        BASE_VERSION: "15-latest"
        UPSTREAM_URL: "https://codeberg.org/api/v1/repos/forgejo/forgejo/releases"
        UPSTREAM_JQ: "map(select(.tag_name | test(\"^v16\\\\..*\"))) | sort_by(-.id) | .[0].tag_name"
        TARBALL_JQ: "map(select(.tag_name | test(\"^v16\\\\..*\"))) | sort_by(-.id) | .[0].tarball_url"
    - tag: 16-pkg
      pkg_name: forgejo16
      containerfile: Containerfile.pkg
    - tag: 16-pkg-latest
      pkg_name: forgejo16
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15-latest"
    - tag: 17
      tag_desc: Built from latest upstream source release of the v17 branch.
      args:
        UPSTREAM_URL: "https://codeberg.org/api/v1/repos/forgejo/forgejo/releases"
        UPSTREAM_JQ: "map(select(.tag_name | test(\"^v17\\\\..*\"))) | sort_by(-.id) | .[0].tag_name"
        TARBALL_JQ: "map(select(.tag_name | test(\"^v17\\\\..*\"))) | sort_by(-.id) | .[0].tarball_url"
    - tag: 17-latest
      tag_desc: Built from latest upstream source release of the v17 branch with latest FreeBSD packages.
      args:
        BASE_VERSION: "15-latest"
        UPSTREAM_URL: "https://codeberg.org/api/v1/repos/forgejo/forgejo/releases"
        UPSTREAM_JQ: "map(select(.tag_name | test(\"^v17\\\\..*\"))) | sort_by(-.id) | .[0].tag_name"
        TARBALL_JQ: "map(select(.tag_name | test(\"^v17\\\\..*\"))) | sort_by(-.id) | .[0].tarball_url"
